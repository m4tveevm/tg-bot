name: Deploy on Push

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            source/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r source/requirements.txt \
            -r requirements-dev.txt

      - name: Run Ruff linter
        run: |
          ruff check . --select E9,F63,F7,F82
          ruff check \
            source/caldav_notification_state.py \
            source/db/repos/caldav_calendar.py \
            source/timezone.py \
            source/timezone_command.py \
            source/datetime_formatting.py \
            source/db/repos/users.py \
            source/migrations/init_db.py \
            source/migrations/migration.py \
            alembic/env.py \
            alembic/versions/0001_add_user_timezones.py \
            tests

      - name: Check Ruff formatting
        run: |
          ruff format --check \
            source/caldav_notification_state.py \
            source/db/repos/caldav_calendar.py \
            source/timezone.py \
            source/timezone_command.py \
            source/datetime_formatting.py \
            source/db/repos/users.py \
            source/migrations/init_db.py \
            source/migrations/migration.py \
            alembic/env.py \
            alembic/versions/0001_add_user_timezones.py \
            tests

      - name: Run unit tests
        run: pytest -q

  build-and-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (via PAT)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: 'JouTak'
          password: ${{ secrets.GHCR_PUSH_TOKEN }} 

      - name: Build and Tag image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/tg-itmocraft"
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          docker build \
            --build-arg GIT_COMMIT=$SHORT_SHA \
            -t $IMAGE:latest -f ./Dockerfile .
          docker tag $IMAGE:latest $IMAGE:${{ github.run_number }}
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Push image
        run: |
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.run_number }}

